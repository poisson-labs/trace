[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poisson-trace"
version = "0.1.0"
description = "Where in the workflow runs die, and whether a change made them fail less: survival curves and a controlled fix check, read from Prove's stored runs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
maintainers = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
keywords = ["survival-analysis", "kaplan-meier", "agents", "evaluation", "traces"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Prove (the `proofload` package) is read at runtime and is not listed here: it is not on
# any package index yet, and an unresolvable name would break every pip and uv resolution
# of this wheel. The README gives the two install lines; the CLI refuses at start without it.
dependencies = ["numpy", "scipy", "pandas>=2"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy", "ruff", "lifelines"]

[project.scripts]
poisson-trace = "poisson_trace.cli:main"
poisson-trace-import = "poisson_trace.ingest.cli:main"

[project.urls]
Homepage = "https://github.com/poisson-labs/trace"
Repository = "https://github.com/poisson-labs/trace"
Issues = "https://github.com/poisson-labs/trace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/poisson_trace"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not lane_j"]
markers = [
    "lane_j: runs another tool itself (DeepEval, Ragas) at its pinned version, installed from PyPI; deselected unless -m lane_j",
]
