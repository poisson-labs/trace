# CI: the suite's lanes on every pull request, on every push to main and every night, and a
# check that the package installs clean and that its docs run as written.
#
# The lanes are the four pyproject.toml names, mark for mark, and release.yml runs the same
# ones on a tag, so CI and a release cannot drift apart.
#
# - pull-request: on every pull request, push and night, on Python 3.11, the oldest the package
#   declares: the pull-request lane, ruff check src tests and mypy --strict. Nothing skips it.
# - portable: on every event, a pull request included, on macOS and Python 3.11: the tests that
#   hold every number Trace computes to the same bits on every platform (the arithmetic rule,
#   the portable functions' accuracy, the golden table of exact bits, the range's ends, the ties
#   at a threshold, and the fixtures' SHA256SUMS), each named by its file. A pull request's other
#   lanes run on Linux, so this is the job that shows a number that differs between the two
#   systems before a merge.
# - math: the statistics' slow checks against their references. Every night and on every push
#   to main; on a pull request only when .github/lanes/math_lane.py says the pull request could
#   have moved a statistic (the statistics code, a test of the math suite, the declared
#   dependencies, or a numpy, scipy, pandas or lifelines other than the lanes were green with).
# - full: on main and every night, never on a pull request: the pull-request lane, the slow
#   lane and the math lane on Python 3.11, 3.12 and 3.13, with ruff and mypy --strict on each,
#   which is what a release runs on each of them.
# - floors: on main and every night, never on a pull request: the pull-request lane, the slow
#   lane, the math lane and lane J on Python 3.11 with numpy and scipy installed at exactly
#   the oldest versions pyproject.toml declares, each read from the one line that declares
#   it, and every other package as lanes-3.11.txt holds it. Every other lane runs with a
#   newer numpy and scipy, so this is the job that says so when Trace stops working at the
#   floors. It checks that the two installed are the floors before any lane runs.
# - newest-prove: on main and every night, never on a pull request: the pull-request lane on
#   Python 3.12 with the newest poisson-prove the package index serves installed over the one
#   the lanes were last green with. Trace declares the oldest Prove it reads and no cap, so a
#   later Prove installs beside it, and this is the lane that says so when one stops reading
#   as Trace expects. Every other lane installs through .github/release/lanes-*.txt, which
#   hold the floor. It stays off pull requests, where a new Prove would fail every one open
#   for something none of them changed.
# - lane-j: on main and every night, never on a pull request: the lane that reads the
#   package index for other tools. It installs the real DeepEval and Ragas and runs the tests
#   that run them, and the tests that the built wheel installs beside a Prove it reads.
# - clean-install: on every event, a pull request included. Builds the source archive and the
#   wheel from the commit; installs one of them with plain pip into a fresh environment, with
#   the `inspect` extra the two Inspect pages ask for (the wheel in one cell, the source
#   archive in another); moves to an empty folder with a home of its own; checks that the
#   package imported is the installed one; then, with every connection but to this machine
#   refused, runs every marked block of the README and the docs through tools/docs_check.py.
#   Every block the docs check skipped is listed in the job's summary. Plain pip brings the
#   newest Prove, so a third cell installs the wheel with the oldest Prove Trace reads named
#   beside it, the floor pyproject.toml declares, and checks that is the one installed.
#
# - history: on every event. Every commit is authored and committed under the work identity
#   and none names an assistant: the check a release runs, .github/release/history.py, over
#   the whole history. On a pull request it reads the pull request's own commits, and not the
#   merge commit the runner makes of them, so a commit under another identity shows before
#   it reaches main.
#
# Where the jobs run. Every runner is one GitHub hosts; none is self-hosted. A pull request's
# jobs run on Linux (ubuntu-latest). A push to main, the night and a run started by hand run
# every job on macOS (macos-latest), where a release runs its lanes too, so both systems the
# package declares are run before a release. No job is cut into shards: a lane is one pytest
# run over every core of its runner. The socket guard is .github/lanes/socket_guard.py, put
# on PYTHONPATH as sitecustomize.py.
#
# On a pull request the pull-request job runs on macOS as well as on Linux. Every number Trace
# computes is the same bits on both systems, and the outputs the tests pin hold on both.
#
# Started by hand ("Run workflow", on any branch) every job runs as it does on main, so the
# jobs a pull request never starts can be run on a branch before it merges.
#
# The workflow reads the repository and nothing else. It holds no secret and asks for no
# token. Every action is pinned to a full commit SHA. CI is unset for every pytest line: Trace
# reads CI as a reason to print plain text, and the tests pin what it prints without it.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_VERSION: "1.6.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  pull-request:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "macos-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -c .github/release/lanes-3.11.txt -e ".[dev]"
          .venv/bin/python --version
          .venv/bin/poisson-trace --version
      - name: Tasks' tokenizer file, which the three-tools recipe the lanes run needs
        run: .venv/bin/poisson-tasks doctor --fix --yes
      - name: Pull-request lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m "not math and not lane_j and not slow" tests
      - name: ruff
        run: .venv/bin/ruff check src tests
      - name: mypy --strict
        run: .venv/bin/mypy --strict

  portable:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -c .github/release/lanes-3.11.txt -e ".[dev]"
          .venv/bin/python --version
          .venv/bin/poisson-trace --version
      - name: The tests that hold the numbers to the same bits on every platform
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider tests/test_portable_arithmetic.py tests/test_portable_functions.py tests/test_portable_golden.py tests/test_portable_interval.py tests/test_portable_ties.py tests/test_fixture_sums.py

  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # On a pull request this is the pull request's own newest commit; on any other event the
      # expression is empty, and the commit the event is for is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every commit is by the work identity, and none names an assistant
        run: python .github/release/history.py

  math:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -e ".[dev]"
          .venv/bin/python -m pip freeze | grep -i -E "^(numpy|scipy|pandas|lifelines)=="
      # The rule is .github/lanes/math_lane.py's: the statistics code (src/poisson_trace/paired.py,
      # src/poisson_trace/survival.py, src/poisson_trace/stats), a test of the math suite, the
      # declared dependencies, or a resolved numpy, scipy, pandas or lifelines that moved.
      - name: Whether this event runs the math lane
        id: rule
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .venv/bin/python .github/lanes/math_lane.py $BASE
      - name: Math lane
        if: steps.rule.outputs.run == 'true'
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m math tests

  full:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # The versions the lanes were last green with are recorded for Python 3.11, 3.12 and 3.13; on
      # a Python with no such file, pip resolves the newest versions the package allows.
      - name: Environment
        run: |
          python -m venv .venv
          constraints=".github/release/lanes-${{ matrix.python }}.txt"
          if [ -f "$constraints" ]; then
            .venv/bin/python -m pip install --quiet -c "$constraints" -e ".[dev]"
          else
            .venv/bin/python -m pip install --quiet -e ".[dev]"
          fi
          .venv/bin/python --version
      # Trace itself left out: these lines, from a run whose lanes are green, are what a
      # .github/release/lanes-*.txt records.
      - name: The packages this environment holds, as pip writes constraints
        run: .venv/bin/python -m pip freeze --exclude-editable
      - name: Tasks' tokenizer file, which the three-tools recipe the lanes run needs
        run: .venv/bin/poisson-tasks doctor --fix --yes
      - name: Pull-request lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m "not math and not lane_j and not slow" tests
      - name: Slow lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m slow tests
      - name: Math lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m math tests
      - name: ruff
        run: .venv/bin/ruff check src tests
      - name: mypy --strict
        run: .venv/bin/mypy --strict

  floors:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Each floor is read from the one line of pyproject.toml that declares it and named
      # beside the install at exactly that version. The constraints are those of the lanes
      # for this Python with their own numpy and scipy lines left out, so those two are all
      # that differs from the full job's environment.
      - name: Environment, with numpy and scipy at exactly the floors pyproject.toml declares
        run: |
          numpy=$(sed -n 's/^dependencies = .*"numpy>=\([0-9][0-9.]*\)".*$/\1/p' pyproject.toml)
          scipy=$(sed -n 's/^dependencies = .*"scipy>=\([0-9][0-9.]*\)".*$/\1/p' pyproject.toml)
          test -n "$numpy"
          test -n "$scipy"
          echo "NUMPY_FLOOR=$numpy" >> "$GITHUB_ENV"
          echo "SCIPY_FLOOR=$scipy" >> "$GITHUB_ENV"
          python -m venv .venv
          grep -v -i -E "^(numpy|scipy)==" .github/release/lanes-3.11.txt > "$RUNNER_TEMP/others.txt"
          .venv/bin/python -m pip install --quiet -c "$RUNNER_TEMP/others.txt" -e ".[dev]" "numpy==$numpy" "scipy==$scipy"
          .venv/bin/python -m pip check
          .venv/bin/python --version
      - name: The numpy and scipy installed are the floors
        run: |
          .venv/bin/python -c "import importlib.metadata, os; found = {name: importlib.metadata.version(name) for name in ('numpy', 'scipy')}; assert found == {'numpy': os.environ['NUMPY_FLOOR'], 'scipy': os.environ['SCIPY_FLOOR']}, found; print('numpy', found['numpy'], 'and scipy', found['scipy'], 'are the oldest Trace declares')"
          echo "numpy $NUMPY_FLOOR and scipy $SCIPY_FLOOR, the oldest Trace declares" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/poisson-trace --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tasks' tokenizer file, which the three-tools recipe the lanes run needs
        run: .venv/bin/poisson-tasks doctor --fix --yes
      - name: Pull-request lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m "not math and not lane_j and not slow" tests
      - name: Slow lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m slow tests
      - name: Math lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m math tests
      # As in the lane-j job: the tests install the two tools themselves, and this step fails
      # early and plainly when the package index cannot serve them.
      - name: The real DeepEval and Ragas, from the package index
        run: |
          DEEPEVAL=$(sed -n 's/^DEEPEVAL = "\(.*\)"$/\1/p' tests/ingest/test_deepeval_package.py)
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --quiet "deepeval==$DEEPEVAL" ragas
      - name: Lane J
        run: env -u CI .venv/bin/python -m pytest -q -p no:cacheprovider -m lane_j tests

  newest-prove:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -c .github/release/lanes-3.12.txt -e ".[dev]"
          .venv/bin/python --version
      # The constraints above hold the floor. This puts the newest Prove over it, with no
      # version named and no constraints, and the version line says which Prove that is.
      - name: The newest Prove on the package index, over the floor
        run: |
          .venv/bin/python -m pip install --quiet --upgrade poisson-prove
          .venv/bin/poisson-trace --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tasks' tokenizer file, which the three-tools recipe the lanes run needs
        run: .venv/bin/poisson-tasks doctor --fix --yes
      - name: Pull-request lane
        run: env -u CI .venv/bin/python -m pytest -n auto -q -p no:cacheprovider -m "not math and not lane_j and not slow" tests

  lane-j:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -c .github/release/lanes-3.12.txt -e ".[dev]"
      # The tests install the two tools themselves, each at the version it pins. This step
      # fails early and plainly when the package index cannot serve them, and warms pip's cache.
      - name: The real DeepEval and Ragas, from the package index
        run: |
          DEEPEVAL=$(sed -n 's/^DEEPEVAL = "\(.*\)"$/\1/p' tests/ingest/test_deepeval_package.py)
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --quiet "deepeval==$DEEPEVAL" ragas
      - name: Lane J
        run: env -u CI .venv/bin/python -m pytest -q -p no:cacheprovider -m lane_j tests

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: wheel
          - install: sdist
          # plain pip brings the newest Prove; this cell names the oldest one Trace reads
          - install: wheel
            prove: floor
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the source archive and the wheel from the commit
        run: |
          python -m pip install --quiet "build==$BUILD_VERSION"
          mkdir "$RUNNER_TEMP/tree"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/tree"
          python -m build --outdir "$RUNNER_TEMP/dist" "$RUNNER_TEMP/tree"
          ls -l "$RUNNER_TEMP/dist"
      # The `inspect` extra is what the two Inspect pages tell a reader to install, so their
      # blocks run here. In the floor's cell the oldest Prove Trace reads is named beside the
      # wheel, read from the one line of pyproject.toml that declares it.
      - name: Install it with plain pip into a fresh environment, with the inspect extra
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          prove=""
          if [ "${{ matrix.prove }}" = "floor" ]; then
            floor=$(sed -n 's/^dependencies = .*"poisson-prove>=\([0-9][0-9.]*\)".*$/\1/p' pyproject.toml)
            test -n "$floor"
            prove="poisson-prove==$floor"
            echo "PROVE_FLOOR=$floor" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.install }}" = "wheel" ]; then
            "$RUNNER_TEMP/clean/bin/python" -m pip install --quiet "$(echo "$RUNNER_TEMP"/dist/*.whl)[inspect]" ${prove:+"$prove"}
          else
            "$RUNNER_TEMP/clean/bin/python" -m pip install --quiet "$(echo "$RUNNER_TEMP"/dist/*.tar.gz)[inspect]"
          fi
          "$RUNNER_TEMP/clean/bin/python" -m pip check
      # The three-tools recipe runs Poisson Tasks and the team's own pytest file. Neither Trace
      # nor Tasks brings pytest, so it is installed here, as the recipe's install line does, at
      # or above the pytest the lanes run with.
      - name: Poisson Tasks at its pin, its tokenizer file and pytest, for the three-tools recipe
        run: |
          "$RUNNER_TEMP/clean/bin/python" -m pip install --quiet "poisson-tasks==0.4.2" "pytest>=9.2.0"
          "$RUNNER_TEMP/clean/bin/poisson-tasks" doctor --fix --yes
      - name: An empty folder, a home of its own, and the package that was installed
        run: |
          mkdir "$RUNNER_TEMP/empty" "$RUNNER_TEMP/home"
          cd "$RUNNER_TEMP/empty"
          export HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/clean/bin/poisson-trace" --version | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/clean/bin/python" -c "import pathlib, sys, poisson_trace; where = pathlib.Path(poisson_trace.__file__).resolve(); env = pathlib.Path(sys.prefix).resolve(); assert env in where.parents, (where, env); print(where)"
          "$RUNNER_TEMP/clean/bin/python" -c "import zstandard; print('zstandard', zstandard.__version__)"
          if [ -n "$PROVE_FLOOR" ]; then
            "$RUNNER_TEMP/clean/bin/python" -c "import importlib.metadata, os; found = importlib.metadata.version('poisson-prove'); assert found == os.environ['PROVE_FLOOR'], found; print('poisson-prove', found, 'is the oldest Trace reads')"
          fi
      # From here on every Python refuses a connection to any address that is not this
      # machine's, and writes it down: the guard is sitecustomize.py in a folder on PYTHONPATH.
      - name: Socket guard, so that no connection leaves this machine
        run: |
          mkdir "$RUNNER_TEMP/guard"
          cp .github/lanes/socket_guard.py "$RUNNER_TEMP/guard/sitecustomize.py"
          echo "PYTHONPATH=$RUNNER_TEMP/guard" >> "$GITHUB_ENV"
          echo "POISSON_TRACE_REFUSED=$RUNNER_TEMP/refused.log" >> "$GITHUB_ENV"
      - name: Every marked block of the README and the docs, run as written
        run: |
          cd "$RUNNER_TEMP/empty"
          export HOME="$RUNNER_TEMP/home"
          export PATH="$RUNNER_TEMP/clean/bin:$PATH"
          python "$GITHUB_WORKSPACE/tools/docs_check.py" --summary "$GITHUB_STEP_SUMMARY"
      - name: Nothing reached for the network, and nothing was left in the empty folder
        run: |
          if [ -e "$RUNNER_TEMP/refused.log" ]; then cat "$RUNNER_TEMP/refused.log"; exit 1; fi
          test -z "$(ls -A "$RUNNER_TEMP/empty")"
